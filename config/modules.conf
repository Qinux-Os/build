# Qinux module graph
#
# The single source of truth for what gets built, in what order, and by which
# kind of build. Read by qinux-build. Format: shell, so it is sourced.
#
# Fields per module, separated by '|':
#
#   name | kind | depends-on | repository
#
# kind          what the builder does with it
#   data      validate JSON, lint shell scripts
#   shell     data, plus shellcheck on everything executable
#   python    data, plus ruff
#   kernel    data, plus the kernel configuration check
#   qml       data, plus qmllint
#   iso       data, plus image assembly
#
# depends-on   space-separated module names, empty if none. An empty field
#              means the module is a root of the graph. Use a real space, never
#              a dash placeholder: the loader has no special case for one.
#
# Order in this file is the default build order for independent modules.
# qinux-build reorders using depends-on, so this is a tiebreaker only.

# --- Group 1: base system ------------------------------------------------
base             | data    |                             | Qinux-Os/base
linux            | kernel  |                             | Qinux-Os/linux
initramfs        | data    | base linux                  | Qinux-Os/initramfs
boot             | data    | base linux initramfs        | Qinux-Os/boot
system           | data    | base                        | Qinux-Os/system
filesystem       | data    | base                        | Qinux-Os/filesystem
hardware         | data    | base system                 | Qinux-Os/hardware

# --- Group 2: packaging ---------------------------------------------------
metadata         | data    |                             | Qinux-Os/metadata
package-index    | data    | metadata                    | Qinux-Os/package-index
mirrors          | data    | metadata                    | Qinux-Os/mirrors
packages         | data    | package-index metadata      | Qinux-Os/packages
pkgbuilds        | data    | packages base               | Qinux-Os/pkgbuilds
package-manager  | shell   | packages pkgbuilds          | Qinux-Os/package-manager
repo             | data    | metadata mirrors pkgbuilds package-manager | Qinux-Os/repo

# --- Group 3: desktop -----------------------------------------------------
xdg              | data    | base                        | Qinux-Os/xdg
apps             | data    | package-index               | Qinux-Os/apps
desktop          | data    | base xdg apps               | Qinux-Os/desktop
theme            | data    | base                        | Qinux-Os/theme
icons            | data    | base theme                  | Qinux-Os/icons
cursor           | data    | base theme                  | Qinux-Os/cursor
fonts            | data    | base                        | Qinux-Os/fonts
branding         | data    |                             | Qinux-Os/branding
wallpapers       | data    | base branding               | Qinux-Os/wallpapers
kde              | data    | base desktop theme icons fonts | Qinux-Os/kde
plasma           | data    | kde                         | Qinux-Os/plasma
kwin             | data    | kde plasma                  | Qinux-Os/kwin
sddm-theme       | data    | theme fonts branding        | Qinux-Os/sddm-theme
plymouth         | data    | theme branding              | Qinux-Os/plymouth

# --- Group 4: Qinux tools -------------------------------------------------
qinux-tools      | shell   | base                        | Qinux-Os/qinux-tools
qinux-cli        | shell   | qinux-tools package-manager | Qinux-Os/qinux-cli
qinux-settings   | qml     | kde plasma qinux-cli        | Qinux-Os/qinux-settings
qinux-welcome    | qml     | kde qinux-cli               | Qinux-Os/qinux-welcome
qinux-update     | python  | qinux-cli package-manager   | Qinux-Os/qinux-update
qinux-hardware   | python  | qinux-cli hardware          | Qinux-Os/qinux-hardware
qinux-system     | python  | qinux-cli base              | Qinux-Os/qinux-system

# --- Group 5: ISO and installer ------------------------------------------
live             | data    | desktop kde plasma          | Qinux-Os/live
calamares-config | data    | desktop branding            | Qinux-Os/calamares-config
installer-modules| data    | calamares-config            | Qinux-Os/installer-modules
installer        | data    | live calamares-config installer-modules | Qinux-Os/installer
iso              | iso     | live installer repo branding | Qinux-Os/iso

# --- Group 6: infrastructure ---------------------------------------------
signing          | data    |                             | Qinux-Os/signing
build            | shell   |                             | Qinux-Os/build
ci               | data    | build                       | Qinux-Os/ci
release          | data    | ci build metadata iso       | Qinux-Os/release
website          | data    | base                        | Qinux-Os/website
docs             | data    | base                        | Qinux-Os/docs

# --- Group 7: community and project --------------------------------------
community        | data    |                             | Qinux-Os/community
.github          | data    |                             | Qinux-Os/.github
documentation     | data    |                             | Qinux-Os/documentation
roadmap          | data    |                             | Qinux-Os/roadmap
rfcs             | data    |                             | Qinux-Os/rfcs